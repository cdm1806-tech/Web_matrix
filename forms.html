<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   <form>
    FirstName:<input type="text" name="name">
    Surname:<input type="text" name="name">
    Lastname:<input type="text" name="name"><br><br>

    Gender:
    <input type="radio" name="gender" value="male">male
    <input type="radio" name="gender" value="female">female
    <input type="radio" name="gender" value="I'd rather not say">I'd rather not say
    <input type="radio" name="gender" value="bisexual">bisexual
    <br><br>

    Skills:
    <input type="checkbox" name="skill" value="html">HTML
    <input type="checkbox" name="skill" value="CSS">CSS
    <input type="checkbox" name="skill" value="Java">Java
    <input type="checkbox" name="skill" value="Javascript">Javascript
    <input type="checkbox" name="skill" value="Python">Python
    <input type="checkbox" name="skill" value="C">C
    <input type="checkbox" name="skill" value="C++">C++
    <br><br>

    Country:
    <select name="country">
        <option value="kenya">kenya</option>
        <option value="USA">USA</option>
        <option value="Uganda">Uganda</option>
        <option value="England">England</option>
        <option value="Tanzania">Tanzania</option>
        <option value="Brasil">Brasil</option>
        <option value="Netherlands">Netherlands<option>
        <option value="Denmark">Denmark</option>
        <option value="Ethiopia">Ethiopia</option>
        <Option value="Uruguay">Uruguay</Option>
        <option value="Paraguay">Paraguay</option>
        <option value="Panama">Panama<option>
        <option value="Cuba">Cuba</option>
    </select>
    <br><br>

    <textarea name="message" rows="12" cols="100">More about yourself:</textarea><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br>
    
    <label for="email">Additional Email(optional):</label>
    <input type="email" id="email" name=""><br><br>

    <input type="submit" value="sign up">
   </form> 
</body>
</html>
