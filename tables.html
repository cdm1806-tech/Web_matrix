
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my table</title>
</head>
<body>
    <table border="1" width="50%" cellpadding="10" align="center" cellspacing="0">
        <caption><b>PLAYER STATS</b></caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Position</th>
                <th>Goals</th>
            </tr>
        </thead>     
        <tbody>
            <tr>
                <td>John</td>
                <td>20</td>
                <td>CDM</td>
                <td>5</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td>20</td>
                <td>1</td>
                <td>5</td>
            </tr>
        </tfoot> 
    </table>           
</body>
</html>
